<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Form</title>
    <style>
      * {
        font-family: cursive;
      }
      body {
        background-color: #1a1a1a;
        margin: 0;
        padding: 0;
        height: 100vh;
        text-align: center;
      }
      .login {
        background-color: #d5d4d4;
        border-radius: 8px;
        padding: 30px;
        width: 300px;
        margin: auto;
        margin-top: 200px;
      }
      div > h2 {
        color: #1a50a0;
      }
      input {
        margin-bottom: 15px;
        padding: 10px;
        border-radius: 5px;
        border: 1px solid black;
        background-color: #d8d8d8;
        width: 250px;
      }
      button {
        background-color: #1b81da;
        color: #fff;
        padding: 10px;
        border-radius: 8px;
        width: 200px;
      }
      button:hover {
        background-color: #0741ac;
      }
    </style>
  </head>
  <body>
    <div class="login">
      <h2>Login</h2>
      <form action="">
        <input type="email" name="" id="" placeholder="Email" />
        <br />
        <input type="password" name="" id="" placeholder="Password" />
        <br />
        <button type="submit">Login</button>
      </form>
    </div>
  </body>
</html>
