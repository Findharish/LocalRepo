<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chess Board</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      table {
        width: 480px;
        height: 480px;
        table-layout: fixed;
        border-collapse: collapse;
        border: 4px solid #333;
      }

      td {
        width: 12.5%;
        height: 12.5%;
        text-align: center;
        vertical-align: middle;
        font-size: 40px;
      }

      .light {
        background-color: #f0d9b5;
      }

      .dark {
        background-color: #b58863;
      }
    </style>
  </head>
  <body>
    <table>
      <tr>
        <td class="dark">♜</td>
        <td class="light">♞</td>
        <td class="dark">♝</td>
        <td class="light">♛</td>
        <td class="dark">♚</td>
        <td class="light">♝</td>
        <td class="dark">♞</td>
        <td class="light">♜</td>
      </tr>
      <tr>
        <td class="light">♟</td>
        <td class="dark">♟</td>
        <td class="light">♟</td>
        <td class="dark">♟</td>
        <td class="light">♟</td>
        <td class="dark">♟</td>
        <td class="light">♟</td>
        <td class="dark">♟</td>
      </tr>
      <tr>
        <td class="dark"></td>
        <td class="light"></td>
        <td class="dark"></td>
        <td class="light"></td>
        <td class="dark"></td>
        <td class="light"></td>
        <td class="dark"></td>
        <td class="light"></td>
      </tr>
      <tr>
        <td class="light"></td>
        <td class="dark"></td>
        <td class="light"></td>
        <td class="dark"></td>
        <td class="light"></td>
        <td class="dark"></td>
        <td class="light"></td>
        <td class="dark"></td>
      </tr>
      <tr>
        <td class="dark"></td>
        <td class="light"></td>
        <td class="dark"></td>
        <td class="light"></td>
        <td class="dark"></td>
        <td class="light"></td>
        <td class="dark"></td>
        <td class="light"></td>
      </tr>
      <tr>
        <td class="light"></td>
        <td class="dark"></td>
        <td class="light"></td>
        <td class="dark"></td>
        <td class="light"></td>
        <td class="dark"></td>
        <td class="light"></td>
        <td class="dark"></td>
      </tr>
      <tr>
        <td class="dark">♙</td>
        <td class="light">♙</td>
        <td class="dark">♙</td>
        <td class="light">♙</td>
        <td class="dark">♙</td>
        <td class="light">♙</td>
        <td class="dark">♙</td>
        <td class="light">♙</td>
      </tr>
      <tr>
        <td class="light">♖</td>
        <td class="dark">♘</td>
        <td class="light">♗</td>
        <td class="dark">♕</td>
        <td class="light">♔</td>
        <td class="dark">♗</td>
        <td class="light">♘</td>
        <td class="dark">♖</td>
      </tr>
    </table>
  </body>
</html>
