<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learn Grid</title>
    <style>
      .container {
        height: 500px;
        border: 2px solid red;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
      }
      .items {
        background-color: brown;
        color: white;
        border: 2px solid yellow;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .item3 {
        grid-column: 3/4;
        grid-row: 1/3;
      }
      .item4 {
        grid-column: 4/5;
        grid-row: 1/3;
      }
      .item5 {
        grid-column: 1/3;
        grid-row: 2/3;
      }
      .item6 {
        grid-column: 1/3;
        grid-row: 3/4;
      }
      .item7 {
        grid-column: 3/5;
        grid-row: 3/4;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="items"><img src="king.webp" alt="virat kholi" /></div>
      <div class="items"><img src="king.webp" alt="virat kholi" /></div>
      <div class="items item3"><img src="king.webp" alt="virat kholi" /></div>
      <div class="items item4"><img src="king.webp" alt="virat kholi" /></div>
      <div class="items item5"><img src="king.webp" alt="virat kholi" /></div>
      <div class="items item6"><img src="king.webp" alt="virat kholi" /></div>
      <div class="items item7"><img src="king.webp" alt="virat kholi" /></div>
    </div>
  </body>
</html>
