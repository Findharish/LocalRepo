<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn js</title>
    <script>
        function main() {
            //Array literal
            let a = [];
            console.log(a, typeof a);

            //Array constructor
            let b = new Array();
            console.log(b, typeof b);


            let c = [1, 2, 3, 4, 5];
            console.log(c, typeof c);

            c[0] = 10;
            c[5] = 6;
            console.log(c, typeof c);

        }
        main();
        console.log(main);
    </script>
</head>

<body>
    <h1>JS</h1>
</body>

</html>
