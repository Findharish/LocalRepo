<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tables</title>
  </head>
  <body>
    <h1>HTML TABLES</h1>
    <table border="2px" cellspacing="10px" cellpadding="20px">
      <thead>
        <tr>
          <th>Product</th>
          <th>Flavors</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td rowspan="3">Milk</td>
          <td>Almond</td>
        </tr>
        <tr>
          <td>Mango</td>
        </tr>
        <tr>
          <td>chocolate</td>
        </tr>
        <tr>
          <td colspan="2">These are exclusive flavors</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
