<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms In Align</title>
  </head>
  <body>
    <h1>Login Form With Alignments</h1>
    <form action="" method="">
      <fieldset>
        <legend>Login Here</legend>
        <table>
          <tr>
            <th>Username</th>
            <td>
              <input
                type="text"
                name="username"
                id="username"
                placeholder="enter your username"
                required
              />
            </td>
          </tr>
          <tr>
            <th>Password</th>
            <td>
              <input
                type="password"
                name="password"
                id="password"
                placeholder="enter your password"
                required
              />
            </td>
          </tr>
          <tr>
            <th colspan="2" align="center">
              <input type="submit" value="Submit" />
            </th>
          </tr>
        </table>
      </fieldset>
    </form>
  </body>
</html>
